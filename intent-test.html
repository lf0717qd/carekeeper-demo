<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>真人意图测试 · 乡音健康管家</title>
<style>
body{margin:0;background:#eef4f2;color:#17363d;font-family:"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{background:#0f4c5c;color:#fff9ef;border-radius:16px;padding:16px 20px}header h1{margin:0 0 4px;font-size:20px}header p{margin:0;font-size:11px;opacity:.85}
.card{background:#fffdf8;border:1px solid #dce8e5;border-radius:14px;padding:12px;margin-top:10px}
button{border:0;border-radius:8px;padding:7px 10px;background:#0f4c5c;color:#fff;cursor:pointer;font-size:11px}input,select,textarea{font:inherit;border:1px solid #cfdedb;border-radius:7px;padding:6px;font-size:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;color:#6b7b7d;border-bottom:1px solid #dce8e5;padding:6px}td{border-bottom:1px dashed #e8f0ee;padding:6px;vertical-align:top}
.pill{display:inline-block;padding:1px 6px;border-radius:99px;font-size:9px;border:1px solid #dce8e5;background:#f4f9f7}.good{background:#eef8f2;border-color:#cfe5d6;color:#2f5f45}.bad{background:#fff3f1;border-color:#f2c8c3;color:#7a1b13}
.note{font-size:10px;color:#6b7b7d}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>div{min-width:140px}
</style></head><body><div class="wrap">
<header><h1>真人意图测试 / 30 条</h1><p>给测试员：照着“测试句”读给老人；把老人实际说的话/ASR结果填进“实际文本”；再跑 Agent 看意图。不是自动假装真人。</p></header>
<div class="card"><div class="row"><div><label>测试员</label><input id="tester" placeholder="姓名/编号"></div><div><label>老人编号</label><input id="elder" placeholder="E01"></div><button id="login">登录演示老人账号</button><button id="export">导出 CSV</button></div><p class="note" id="msg">未登录；登录后才能跑 Agent。所有数据只存本机。</p></div>
<div class="card"><table><thead><tr><th>#</th><th>测试句（读给老人）</th><th>期望意图</th><th>实际文本</th><th>Agent 结果</th><th>判定</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script src="config.js?v=22"></script>
<script>
(function(){
 var CFG=window.CAREKEEPER_CONFIG||window.CONFIG||{};var API=String(CFG.apiBase||"").replace(/\/+$/,"");
 var qp=new URLSearchParams(location.search);if(qp.get("api"))API=qp.get("api").replace(/\/+$/,"");
 var token=sessionStorage.getItem("ck_test_token")||"";
 var cases=[
 ["我心口痛","emergency"],["我唞唔到气","emergency"],["我晕低","emergency"],["我跌倒","emergency"],["我半边身无力","emergency"],
 ["我今日血压高","bp"],["上压150","bp"],["下压90","bp"],["量血压","bp"],
 ["血糖低","glucose"],["甜尿","glucose"],["血糖8.2","glucose"],
 ["漏服药","medication"],["食降压药","medication"],["二甲双胍","medication"],["药","medication"],
 ["换片","wound"],["伤口出水","wound"],["压疮","wound"],["造口","wound"],
 ["起身头晕","fall"],["行唔稳","fall"],["糖尿餐","diet"],["食盐","diet"],
 ["我想预约","appointment"],["复诊","appointment"],["我想约下周三","appointment"],
 ["报告","report"],["回执","report"],["叫医生","staff"],["早晨","greeting"],["哈哈哈","unknown"],["今日天气","unknown"]
 ].slice(0,30);
 var results={};try{results=JSON.parse(localStorage.getItem("ck_intent_results")||"{}")}catch(e){results={}}
 function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
 function save(){localStorage.setItem("ck_intent_results",JSON.stringify(results))}
 function render(){
   var tb=document.getElementById("rows");tb.innerHTML="";
   cases.forEach(function(c,i){var r=results[i]||{};var tr=document.createElement("tr");
     tr.innerHTML="<td>"+(i+1)+"</td><td>"+esc(c[0])+"</td><td>"+esc(c[1])+"</td>"+
       "<td><textarea data-i='"+i+"' rows='2' style='width:100%' placeholder='老人实际说的话'>"+esc(r.text||"")+"</textarea></td>"+
       "<td>"+esc(r.actual||"—")+"</td><td>"+(r.actual?('<span class="pill '+(r.actual===c[1]?"good":"bad")+'">'+(r.actual===c[1]?"通过":"不符")+'</span>'):"—")+"</td>"+
       "<td><button data-run='"+i+"'>跑 Agent</button></td>";
     tb.appendChild(tr);
   });
   tb.querySelectorAll("textarea").forEach(function(t){t.onchange=function(){var i=t.dataset.i;results[i]=results[i]||{};results[i].text=t.value;save()}});
   tb.querySelectorAll("[data-run]").forEach(function(b){b.onclick=function(){run(Number(b.dataset.run))}});
 }
 async function login(){
   try{var r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:"13800000001",password:"123456"})});var d=await r.json();if(!r.ok)throw new Error(d.error||"login");token=d.token;sessionStorage.setItem("ck_test_token",token);document.getElementById("msg").textContent="已登录："+d.name; }
   catch(e){document.getElementById("msg").textContent="登录失败："+e.message}
 }
 async function run(i){
   var r=results[i]||{};var text=(r.text||"").trim();if(!text){alert("先填实际文本");return}
   if(!token){alert("先登录");return}
   try{var res=await fetch(API+"/api/agent/turn",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({patient_id:"chen",message:text,state:{}})});var d=await res.json();r.actual=d.intent||"?";results[i]=r;save();render();}
   catch(e){alert("失败："+e.message)}
 }
 function exportCSV(){
   var lines=[["#","测试句","期望意图","实际文本","Agent结果","判定"].join(",")];
   cases.forEach(function(c,i){var r=results[i]||{};var ok=r.actual?String(r.actual===c[1]):"";lines.push([i+1,c[0],c[1],(r.text||""),r.actual||"",ok].map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(","))});
   var blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="intent30_results.csv";a.click();
 }
 document.getElementById("login").onclick=login;document.getElementById("export").onclick=exportCSV;
 if(token)document.getElementById("msg").textContent="已登录（可跑 Agent）";
 render();
})();
</script></body></html>
