<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多通道统一接入 · 乡音健康管家</title>
<style>
  :root{--ink:#17363d;--teal:#0f4c5c;--orange:#e07a3f;--muted:#6b7b7d;--line:#dce8e5;--paper:#fffdf8;--bad:#b23a2b}
  *{box-sizing:border-box}
  body{margin:0;background:#eef4f2;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.55}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 50px}
  header{background:linear-gradient(135deg,#0f4c5c,#1f6f7a);color:#fff9ef;border-radius:20px;padding:20px 24px}
  header h1{margin:0 0 4px;font-size:23px}header p{margin:0;font-size:12px;opacity:.85}
  .badge{display:inline-block;background:#fff4e8;color:#7a5438;border:1px solid #efd8c3;border-radius:999px;padding:3px 8px;font-size:10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tab{border:1px solid #d4e2df;background:#fff;color:var(--teal);border-radius:999px;padding:7px 11px;font:inherit;font-size:11px;cursor:pointer}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-top:12px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:8px}
  textarea{width:100%;height:74px;font:inherit;font-size:13px;border:1px solid #cfdedb;border-radius:10px;padding:9px;resize:vertical}
  button.send{font:inherit;font-size:12px;border:0;border-radius:9px;padding:8px 12px;background:var(--teal);color:#fff;cursor:pointer;margin-top:8px}
  .out{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:13px;white-space:pre-wrap;min-height:50px}
  .pill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:9px;border:1px solid #dce8e5;background:#f4f9f7;color:#52676a}
  .pill.bad{background:#fff3f1;border-color:#f2c8c3;color:#7a1b13}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note{background:#fff4e8;border:1px solid #efd8c3;color:#7a5438;border-radius:12px;padding:10px 12px;font-size:11px;margin-top:12px}
  footer{text-align:center;color:var(--muted);font-size:10px;margin-top:18px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:16px}.wrap{padding:12px 10px 40px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>多通道统一接入 <span class="badge">FR-02 · 适配层 Demo</span></h1>
    <p>同一个 Agent、同一套红线/用药规则、统一响应信封；电话/微信/社区是适配器占位，不是真实接通。</p>
  </header>

  <div class="note">
    已实现：统一 <b>/api/channel/message</b> 接入协议、通道识别、会话 ID、统一回复/风险/转人工字段、审计。
    未接：SIP/电话网关、微信公众号、企业微信、社区工单。下面页面只验证“同一个 Agent 能接多个通道”。
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="meta" id="meta"></div>
    <textarea id="msg">我今日血压高</textarea>
    <button class="send" id="send">发送到当前通道</button>
    <div class="out" id="out">选择通道后发送。</div>
  </div>

  <div class="grid">
    <div class="card"><strong>统一响应字段</strong><div class="out" id="envelope">—</div></div>
    <div class="card"><strong>通道边界</strong><div class="out" id="limits">—</div></div>
  </div>
  <footer>乡音健康管家 · 多通道适配层 · 不诊断、不开药</footer>
</div>
<script src="config.js?v=20"></script>
<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const API=String((window.CONFIG&&CONFIG.apiBase)||"").replace(/\/+$/,"");
  let channels=[], current="web";
  const fallback=[
    {id:"web",label:"老人端 Web",mode:"native",transport:"HTTPS"},
    {id:"family",label:"家属端",mode:"native",transport:"HTTPS"},
    {id:"phone",label:"电话/IVR",mode:"adapter_demo",transport:"SIP/电话网关（未接）"},
    {id:"wechat",label:"微信",mode:"adapter_demo",transport:"公众号/企业微信（未接）"},
    {id:"community",label:"社区/家医",mode:"adapter_demo",transport:"工单/电话（未接）"}
  ];
  function render(){
    $("#tabs").innerHTML=channels.map(c=>'<button class="tab '+(c.id===current?"on":"")+'" data-id="'+c.id+'">'+c.label+'</button>').join("");
    const c=channels.find(x=>x.id===current);
    $("#meta").innerHTML='<span class="pill">'+c.id+'</span><span class="pill">'+c.mode+'</span><span class="pill">'+c.transport+'</span>';
    $("#limits").textContent=c.mode==="native"?"原生通道：当前 Demo 页面。":"适配器占位：协议已统一，真实网关未接；上线前需运营商/公众号/工单系统。";
  }
  function setCurrent(id){current=id;render();}
  $("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)setCurrent(b.dataset.id);});
  $("#send").addEventListener("click",async()=>{
    const text=$("#msg").value.trim(); if(!text)return;
    $("#out").textContent="发送中…";$("#envelope").textContent="—";
    try{
      const r=await fetch(API+"/api/channel/message",{method:"POST",headers:{"Content-Type":"application/json","X-Request-ID":"CH-UI-"+Date.now()},body:JSON.stringify({channel:current,user_id:"demo-user-001",message:text,profile:{name:"陈婆婆"},history:[]})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      $("#out").innerHTML='<span class="pill">'+d.channel+'</span> <span class="pill '+(d.risk==="high"?"bad":"")+'">'+d.risk+'</span><br><br>'+d.reply;
      $("#envelope").textContent=JSON.stringify({channel:d.channel,session_id:d.session_id,source:d.source,risk:d.risk,needs_human:d.needs_human,handoff:d.handoff,citations:d.citations||[]},null,2);
    }catch(e){$("#out").textContent="失败："+e.message+"（FC 可能还没上传新版）";}
  });
  fetch(API+"/api/channels").then(r=>r.json()).then(d=>{channels=d.channels||fallback;render();}).catch(()=>{channels=fallback;render();});
})();
</script>
</body>
</html>
