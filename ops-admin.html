<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营后台 · 乡音健康管家</title>
<style>
  :root{--ink:#17363d;--teal:#0f4c5c;--orange:#e07a3f;--muted:#6b7b7d;--line:#dce8e5;--paper:#fffdf8;--bad:#b23a2b;--good:#2f7d5b;--bg:#eef4f2}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.55}
  button,input,select,textarea{font:inherit}.hidden{display:none!important}
  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login .card{width:min(430px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(15,76,92,.12)}
  .brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:20px}
  .brand h1{margin:0;font-size:21px}.brand p{margin:2px 0 0;font-size:10px;color:var(--muted)}
  label{display:block;font-size:10px;color:var(--muted);margin:12px 0 4px}input,select{width:100%;padding:9px 10px;border:1px solid #cfdedb;border-radius:9px;background:#fff;font-size:13px}
  .primary{border:0;border-radius:9px;padding:9px 14px;background:var(--teal);color:#fff;cursor:pointer;font-size:12px}.ghost{border:1px solid #cfdedb;border-radius:9px;padding:8px 11px;background:#fff;color:var(--teal);cursor:pointer;font-size:11px}
  .err{color:var(--bad);font-size:11px;min-height:16px;margin-top:6px}
  .top{background:var(--teal);color:#fff9ef;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .top .brand h1{font-size:17px}.top .logo{width:34px;height:34px;font-size:16px;background:#fff2e6;color:var(--teal)}.top .brand p{color:#cfe3df}
  .top .who{font-size:11px;display:flex;gap:8px;align-items:center}.top .pill{background:#fff2e6;color:#7a5438;border-radius:99px;padding:2px 8px;font-size:10px}
  .logout{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:10px}
  .wrap{max-width:1180px;margin:0 auto;padding:14px}
  .tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid #d4e2df;background:#fff;color:var(--teal);border-radius:99px;padding:7px 10px;font-size:11px;cursor:pointer}.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px;color:var(--teal)}.stat span{font-size:9px;color:var(--muted)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px;overflow:auto}.card h3{margin:0 0 7px;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:11px;min-width:680px}th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:7px 6px}td{border-bottom:1px dashed #e8f0ee;padding:7px 6px;vertical-align:top}
  .pill{display:inline-block;border-radius:99px;padding:1px 6px;font-size:9px;border:1px solid #dce8e5;background:#f4f9f7;color:#52676a}.pill.bad{background:#fff3f1;border-color:#f2c8c3;color:#7a1b13}.pill.good{background:#eef8f2;border-color:#cfe5d6;color:#2f5f45}.pill.warn{background:#fff4e8;border-color:#efd8c3;color:#7a5438}
  .bar{height:7px;background:#e8f0ee;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--orange)}
  .actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{border:1px solid #cfdedb;background:#fff;color:var(--teal);border-radius:7px;padding:3px 7px;font-size:10px;cursor:pointer}
  .formrow{display:flex;gap:7px;flex-wrap:wrap;align-items:end}.formrow>div{min-width:120px}.formrow label{margin:0 0 3px}
  .note{font-size:10px;color:var(--muted);margin-top:6px}.empty{color:var(--muted);font-size:11px;padding:8px}
  @media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:9px}.top{padding:10px}table{min-width:600px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card">
  <div class="brand"><div class="logo">乡</div><div><h1>运营后台</h1><p>乡音健康管家 · 满意度/话术/标注/灰度/词表</p></div></div>
  <label>管理员账号</label><input id="account" value="13800000009">
  <label>密码</label><input id="password" type="password" value="123456">
  <div class="err" id="err"></div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="primary" id="loginBtn">登录</button><span class="note">演示账号，非真实后台权限</span></div>
</div></div>

<div id="app" class="hidden">
  <div class="top"><div class="brand"><div class="logo">乡</div><div><h1>运营后台</h1><p>满意回访 · 话术 A/B · 标注 · 灰度 · 词表审核</p></div></div><div class="who"><span class="pill">admin</span><span id="who"></span><button class="logout" id="logout">退出</button></div></div>
  <div class="wrap"><div class="tabs" id="tabs"></div><div id="content"></div></div>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17363d;color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;opacity:0;transition:.2s;z-index:20" id="toast"></div>
<script src="config.js?v=22"></script>
<script>
(function(){
  var CFG=window.CAREKEEPER_CONFIG||window.CONFIG||{};
  var API=String(CFG.apiBase||"").replace(/\/+$/,"");
  var qp=new URLSearchParams(location.search); if(qp.get("api")) API=qp.get("api").replace(/\/+$/,"");
  var token=sessionStorage.getItem("ck_admin_token")||"";
  var tab="overview", data=null;
  var tabs=[["overview","总览"],["feedback","满意度/回访"],["templates","话术 A/B"],["annotations","标注"],["releases","灰度发布"],["terms","词表审核"],["sites","站点默认"]];
  var $=function(s){return document.querySelector(s)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
  function toast(t){var e=$("#toast");e.textContent=t;e.style.opacity=1;setTimeout(function(){e.style.opacity=0},1800)}
  function auth(){return token?{Authorization:"Bearer "+token}:{}}
  async function api(path,opt){opt=opt||{};opt.headers=Object.assign({"Content-Type":"application/json"},auth(),opt.headers||{});var r=await fetch(API+path,opt);var d=await r.json();if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
  function login(){fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:$("#account").value.trim(),password:$("#password").value})}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})}).then(function(x){if(!x.ok)throw new Error(x.d.error||"登录失败");if(x.d.role!=="admin")throw new Error("不是管理员账号");token=x.d.token;sessionStorage.setItem("ck_admin_token",token);$("#who").textContent=x.d.name;show()}).catch(function(e){$("#err").textContent=e.message})}
  function logout(){token="";sessionStorage.removeItem("ck_admin_token");$("#app").classList.add("hidden");$("#login").classList.remove("hidden")}
  async function load(){data=await api("/api/admin/overview");render()}
  function show(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#who").textContent=$("#who").textContent||"运营管理员";load().catch(function(e){toast(e.message)})}
  function renderTabs(){$("#tabs").innerHTML=tabs.map(function(x){return '<button data-t="'+x[0]+'" class="'+(x[0]===tab?"on":"")+'">'+x[1]+'</button>'}).join("");document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}})}
  function render(){
    if(!data)return;renderTabs();
    var c=$("#content");
    if(tab==="overview"){
      var open=data.feedback.filter(function(x){return x.status==="open"}).length;
      var pend=data.annotations.filter(function(x){return x.status==="pending"}).length;
      var terms=data.terms.filter(function(x){return x.status==="pending"}).length;
      c.innerHTML='<div class="grid"><div class="stat"><b>'+data.feedback.length+'</b><span>满意度/回访记录</span></div><div class="stat"><b>'+open+'</b><span>待回访</span></div><div class="stat"><b>'+pend+'</b><span>待标注</span></div><div class="stat"><b>'+terms+'</b><span>待审词条</span></div></div>'+
      '<div class="card"><h3>最近动态</h3><table><thead><tr><th>类型</th><th>内容</th><th>状态</th></tr></thead><tbody>'+
      data.feedback.slice(0,3).map(function(x){return '<tr><td>满意度</td><td>'+esc(x.patient)+' · '+x.score+'分 · '+esc(x.comment)+'</td><td>'+pill(x.status)+'</td></tr>'}).join("")+
      data.releases.slice(0,2).map(function(x){return '<tr><td>灰度</td><td>'+esc(x.version)+' · '+x.percent+'%</td><td>'+pill(x.status)+'</td></tr>'}).join("")+'</tbody></table></div>'+
      '<div class="card"><h3>运营边界</h3><p class="note">本后台是 Demo：数据在 SQLite /tmp；灰度只改记录，不真正切流量；词表审核不等于临床签字；标注只做队列演示。</p></div>';
    } else if(tab==="feedback"){
      c.innerHTML='<div class="card"><h3>满意度 / 回访</h3><table><thead><tr><th>老人</th><th>类型</th><th>评分</th><th>意见</th><th>状态</th><th>回访</th><th>操作</th></tr></thead><tbody>'+
      data.feedback.map(function(x){return '<tr><td>'+esc(x.patient)+'</td><td>'+esc(x.kind)+'</td><td>'+x.score+'</td><td>'+esc(x.comment)+'</td><td>'+pill(x.status)+'</td><td>'+esc(x.follow_up||"—")+'</td><td class="actions"><button data-fb="'+x.id+'">标记已回访</button></td></tr>'}).join("")+'</tbody></table><p class="note">评分来自演示数据；真实回访要记录谁回访、何时、结果。</p></div>';
      document.querySelectorAll("[data-fb]").forEach(function(b){b.onclick=async function(){try{var d=await api("/api/admin/feedback",{method:"POST",body:JSON.stringify({id:Number(b.dataset.fb),status:"done",follow_up:"已回访（运营后台）"})});data=d.overview;render();toast("已标记回访")}catch(e){toast(e.message)}}});
    } else if(tab==="templates"){
      var groups={};data.templates.forEach(function(t){(groups[t.name]=groups[t.name]||[]).push(t)});
      c.innerHTML='<div class="card"><h3>话术模板 A/B</h3>'+Object.keys(groups).map(function(k){return '<div style="margin:10px 0"><strong>'+esc(k)+'</strong>'+groups[k].map(function(t){var rate=t.sent?Math.round(t.positive/t.sent*100):0;return '<div style="margin:6px 0;padding:7px;border:1px solid #e8f0ee;border-radius:8px"><span class="pill '+(t.variant==="B"?"warn":"")+'">'+t.variant+'</span> '+esc(t.text)+'<div class="bar"><i style="width:'+rate+'%"></i></div><span class="note">发送 '+t.sent+' · 正向 '+t.positive+' · '+rate+'% · '+(t.active?"启用":"停用")+'</span> <button class="ghost" data-tpl="'+t.id+'" data-active="'+(t.active?0:1)+'">'+(t.active?"停用":"启用")+'</button></div>'}).join("")+'</div>'}).join("")+'<p class="note">A/B 只是记录，不是统计显著；真实实验要随机分流和样本量。</p></div>';
      document.querySelectorAll("[data-tpl]").forEach(function(b){b.onclick=async function(){try{var d=await api("/api/admin/templates",{method:"POST",body:JSON.stringify({id:Number(b.dataset.tpl),active:b.dataset.active==="1"})});data=d.overview;render();toast("已更新")}catch(e){toast(e.message)}}});
    } else if(tab==="annotations"){
      c.innerHTML='<div class="card"><h3>标注队列</h3><table><thead><tr><th>chunk</th><th>方言</th><th>标注员</th><th>状态</th><th>标签/备注</th><th>操作</th></tr></thead><tbody>'+
      data.annotations.map(function(x){return '<tr><td>'+esc(x.chunk_id)+'</td><td>'+esc(x.dialect)+'</td><td>'+esc(x.assignee)+'</td><td>'+pill(x.status)+'</td><td>'+esc((x.label||"")+" "+(x.note||""))+'</td><td class="actions"><button data-ann="'+x.id+'" data-st="done">通过</button><button data-ann="'+x.id+'" data-st="review">退回</button></td></tr>'}).join("")+'</tbody></table><p class="note">只做队列/状态演示；真实标注要双人复核、一致性统计、导出训练集。</p></div>';
      document.querySelectorAll("[data-ann]").forEach(function(b){b.onclick=async function(){try{var d=await api("/api/admin/annotations",{method:"POST",body:JSON.stringify({id:Number(b.dataset.ann),status:b.dataset.st,label:"运营复核",note:"演示操作"})});data=d.overview;render();toast("已更新")}catch(e){toast(e.message)}}});
    } else if(tab==="releases"){
      c.innerHTML='<div class="card"><h3>灰度发布</h3><div class="formrow"><div><label>版本</label><input id="relVer" value="v1.2.01"></div><div><label>流量 %</label><input id="relPct" type="number" value="10" min="1" max="100"></div><button class="primary" id="relAdd">创建灰度</button></div><table style="margin-top:10px"><thead><tr><th>版本</th><th>流量</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody>'+
      data.releases.map(function(x){return '<tr><td>'+esc(x.version)+'</td><td>'+x.percent+'%</td><td>'+pill(x.status)+'</td><td>'+esc(x.note||"")+'</td><td class="actions"><button data-rel="'+x.id+'" data-st="stable">全量</button><button data-rel="'+x.id+'" data-st="rolled_back">回滚</button></td></tr>'}).join("")+'</tbody></table><p class="note">只改数据库记录，不切真实流量；生产要网关/配置中心/健康检查。</p></div>';
      $("#relAdd").onclick=async function(){try{var d=await api("/api/admin/releases",{method:"POST",body:JSON.stringify({version:$("#relVer").value.trim(),percent:Number($("#relPct").value||10),note:"运营后台创建"})});data=d.overview;render();toast("已创建灰度记录")}catch(e){toast(e.message)}};
      document.querySelectorAll("[data-rel]").forEach(function(b){b.onclick=async function(){if(!confirm("确认更新发布状态？"))return;try{var d=await api("/api/admin/releases",{method:"POST",body:JSON.stringify({id:Number(b.dataset.rel),status:b.dataset.st})});data=d.overview;render();toast("已更新")}catch(e){toast(e.message)}}});
    } else if(tab==="sites"){
      c.innerHTML='<div class="card"><h3>站点默认</h3>'+data.sites.map(function(x){return '<div style="border:1px solid #e8f0ee;border-radius:10px;padding:9px;margin:8px 0"><strong>'+esc(x.name)+'</strong> <span class="pill">'+esc(x.status)+'</span><div class="formrow" style="margin-top:6px"><div><label>方言</label><input data-site="'+x.id+'" data-k="dialect" value="'+esc(x.dialect)+'"></div><div><label>音色</label><input data-site="'+x.id+'" data-k="voice" value="'+esc(x.voice)+'"></div><div><label>告警对象</label><input data-site="'+x.id+'" data-k="alert_target" value="'+esc(x.alert_target)+'"></div><div><label>KB范围</label><input data-site="'+x.id+'" data-k="kb_scope" value="'+esc(x.kb_scope)+'"></div><button class="primary" data-save="'+x.id+'">保存</button></div></div>'}).join("")+'<p class="note">站点默认只影响默认方言/音色/告警对象；潮汕/客家目前 L1，不冒充原生 TTS。</p></div>';
      document.querySelectorAll("[data-save]").forEach(function(b){b.onclick=async function(){try{var sid=b.dataset.save;var payload={id:sid};document.querySelectorAll('[data-site="'+sid+'"]').forEach(function(inp){payload[inp.dataset.k]=inp.value});var d=await api("/api/admin/sites",{method:"POST",body:JSON.stringify(payload)});data=d.overview;render();toast("站点已更新")}catch(e){toast(e.message)}}});
    } else {
      c.innerHTML='<div class="card"><h3>方言词表审核</h3><table><thead><tr><th>词</th><th>标准/粤拼</th><th>类型</th><th>状态</th><th>意见</th><th>操作</th></tr></thead><tbody>'+
      data.terms.map(function(x){return '<tr><td><strong>'+esc(x.term)+'</strong></td><td>'+esc(x.standard)+'</td><td>'+esc(x.kind)+'</td><td>'+pill(x.status)+'</td><td>'+esc(x.note||"")+'</td><td class="actions"><button data-term="'+x.id+'" data-st="approved">通过</button><button data-term="'+x.id+'" data-st="rejected">退回</button></td></tr>'}).join("")+'</tbody></table><p class="note">这是运营/方言顾问的审核队列；不等于临床签字，也不代表 150 条全审完。</p></div>';
      document.querySelectorAll("[data-term]").forEach(function(b){b.onclick=async function(){try{var d=await api("/api/admin/terms",{method:"POST",body:JSON.stringify({id:Number(b.dataset.term),status:b.dataset.st,note:"运营复核"})});data=d.overview;render();toast("已更新")}catch(e){toast(e.message)}}});
    }
  }
  function pill(s){var cls=s==="done"||s==="stable"||s==="approved"?"good":s==="open"||s==="rolled_back"||s==="rejected"?"bad":s==="canary"||s==="review"?"warn":"";return '<span class="pill '+cls+'">'+esc(s)+'</span>'}
  $("#loginBtn").onclick=login;$("#password").addEventListener("keydown",function(e){if(e.key==="Enter")login()});$("#logout").onclick=logout;
  if(token){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");show()}else{$("#login").classList.remove("hidden")}
})();
</script>
</body>
</html>
