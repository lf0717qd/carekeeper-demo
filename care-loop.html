<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>照护闭环 · 乡音健康管家</title>
<style>
body{margin:0;background:#eef4f2;color:#17363d;font-family:"Microsoft YaHei",sans-serif;line-height:1.5}.wrap{max-width:1100px;margin:0 auto;padding:14px}
header{background:#0f4c5c;color:#fff9ef;border-radius:16px;padding:16px 18px}header h1{margin:0 0 3px;font-size:20px}header p{margin:0;font-size:11px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.card{background:#fffdf8;border:1px solid #dce8e5;border-radius:14px;padding:12px;min-width:0}.card h3{margin:0 0 7px;font-size:14px}
label{display:block;font-size:10px;color:#6b7b7d;margin:7px 0 3px}input,select{width:100%;padding:7px;border:1px solid #cfdedb;border-radius:7px;font:inherit;font-size:11px;background:#fff}
button{border:0;border-radius:7px;padding:7px 9px;background:#0f4c5c;color:#fff;font-size:11px;cursor:pointer}.ghost{background:#fff;color:#0f4c5c;border:1px solid #cfdedb}
table{width:100%;border-collapse:collapse;font-size:10.5px}th{text-align:left;color:#6b7b7d;border-bottom:1px solid #dce8e5;padding:5px}td{border-bottom:1px dashed #e8f0ee;padding:5px}
.pill{display:inline-block;border-radius:99px;padding:1px 6px;font-size:9px;background:#f4f9f7;border:1px solid #dce8e5;color:#52676a}.good{background:#eef8f2;border-color:#cfe5d6;color:#2f5f45}.bad{background:#fff3f1;border-color:#f2c8c3;color:#7a1b13}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.note{font-size:10px;color:#6b7b7d;margin-top:6px}.summary{white-space:pre-wrap;font-size:12px;background:#f4f9f7;border:1px dashed #cfe0dc;border-radius:9px;padding:10px;margin-top:8px;display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><h1>照护闭环</h1><p>复诊绑定 · 用药打卡 · 血压记录 · 医生摘要（Demo，不诊断/不开药）</p></header>
<div class="grid">
<section class="card"><h3>血压记录</h3><div class="row"><div><label>时间</label><input id="bpTime" type="datetime-local"></div><div><label>来源</label><select id="bpSource"><option value="manual">手动输入</option><option value="device">血压计</option></select></div></div><div class="row"><div><label>上压</label><input id="bpSys" type="number" placeholder="148"></div><div><label>下压</label><input id="bpDia" type="number" placeholder="86"></div></div><button id="bpAdd" style="margin-top:8px">记录血压</button><table style="margin-top:8px"><thead><tr><th>时间</th><th>数值</th><th>来源</th></tr></thead><tbody id="bpRows"></tbody></table></section>
<section class="card"><h3>用药打卡</h3><table><thead><tr><th>药</th><th>用法</th><th>打卡</th></tr></thead><tbody id="medRows"></tbody></table><p class="note">提醒：App 内 + 语音；系统闹钟/推送未接。药丸图片需药师审核后再加。</p></section>
<section class="card"><h3>复诊绑定</h3><div><label>复诊时间</label><input id="fuTime" type="datetime-local"></div><div class="row"><div><label>医院</label><input id="fuHospital" value="社区医院"></div><div><label>科室</label><input id="fuDept" value="慢病门诊"></div></div><div><label>提前提醒</label><input id="fuRemind" type="datetime-local"></div><button id="fuAdd" style="margin-top:8px">绑定复诊</button><table style="margin-top:8px"><thead><tr><th>时间</th><th>地点</th></tr></thead><tbody id="fuRows"></tbody></table></section>
</div>
<div class="card" style="margin-top:10px"><h3>医生只读摘要</h3><button id="summaryBtn">生成摘要</button><div id="summary" class="summary"></div></div>
</div>
<script src="config.js?v=23"></script><script>
(function(){var CFG=window.CAREKEEPER_CONFIG||window.CONFIG||{};var API=String(CFG.apiBase||"").replace(/\/+$/,"");var qp=new URLSearchParams(location.search);if(qp.get("api"))API=qp.get("api").replace(/\/+$/,"");var token=sessionStorage.getItem("ck_token")||"";var $=function(s){return document.querySelector(s)};function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function note(t){$("#summary").style.display="block";$("#summary").textContent=t}
async function auth(){if(token)return token;var r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:"13800000001",password:"123456"})});var d=await r.json();token=d.token;sessionStorage.setItem("ck_token",token);return token}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({"Content-Type":"application/json",Authorization:"Bearer "+await auth()},opt.headers||{});var r=await fetch(API+path,opt);var d=await r.json();if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
function dt(v){return v?String(v).replace("T"," ").slice(0,16):""}
function renderCare(d){var bps=d.bp||[];$("#bpRows").innerHTML=bps.slice(0,6).map(function(x){return "<tr><td>"+esc(x.measured_at)+"</td><td>"+x.systolic+"/"+x.diastolic+"</td><td>"+esc(x.source)+"</td></tr>"}).join("")||"<tr><td colspan=3>暂无</td></tr>";var meds=d.medications||[];$("#medRows").innerHTML=meds.map(function(m){return "<tr><td>"+esc(m.name)+"<br><span class=note>"+esc(m.dose)+"</span></td><td>"+esc(m.instruction)+"</td><td><button class=ghost data-med=\""+m.id+"\" data-slot=\""+(m.slot==="both"?"am":m.slot)+"\">打卡</button></td></tr>"}).join("")||"<tr><td colspan=3>暂无</td></tr>";var fus=d.followups||[];$("#fuRows").innerHTML=fus.map(function(f){return "<tr><td>"+esc(f.appointment_at)+"</td><td>"+esc(f.hospital+" "+f.department)+"</td></tr>"}).join("")||"<tr><td colspan=2>暂无</td></tr>";document.querySelectorAll("[data-med]").forEach(function(b){b.onclick=async function(){try{var r=await api("/api/app/med-checkin",{method:"POST",body:JSON.stringify({patient_id:"chen",med_id:Number(b.dataset.med),slot:b.dataset.slot})});renderCare(r.care);note("已打卡："+new Date().toLocaleString())}catch(e){note("打卡失败："+e.message)}}})}
async function load(){try{var d=await api("/api/app/care?patient_id=chen");renderCare(d)}catch(e){note("加载失败："+e.message)}}
$("#bpAdd").onclick=async function(){try{var r=await api("/api/app/bp",{method:"POST",body:JSON.stringify({patient_id:"chen",measured_at:dt($("#bpTime").value)||new Date().toLocaleString(),systolic:Number($("#bpSys").value),diastolic:Number($("#bpDia").value),source:$("#bpSource").value})});renderCare(r.care);note("血压已记录")}catch(e){note("记录失败："+e.message)}};
$("#fuAdd").onclick=async function(){try{var r=await api("/api/app/followups",{method:"POST",body:JSON.stringify({patient_id:"chen",appointment_at:dt($("#fuTime").value),hospital:$("#fuHospital").value,department:$("#fuDept").value,remind_at:dt($("#fuRemind").value)})});renderCare(r.care);note("复诊已绑定")}catch(e){note("绑定失败："+e.message)}};
$("#summaryBtn").onclick=async function(){try{var d=await api("/api/app/doctor-summary?patient_id=chen");var t="医生只读摘要\\n患者："+d.patient.name+"\\n近7次血压平均："+(d.avg.systolic||"—")+"/"+(d.avg.diastolic||"—")+" mmHg\\n用药打卡："+d.adherence.done+"/"+d.adherence.total+"\\n复诊："+(d.followups[0]?d.followups[0].appointment_at+" "+d.followups[0].hospital:"未绑定")+"\\n\\n只读，不诊断、不开药。";note(t)}catch(e){note("摘要失败："+e.message)}};
load();
})();
</script></body></html>
