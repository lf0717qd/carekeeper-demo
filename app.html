<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>乡音健康管家 · 三端 App</title>
<style>
  :root{--ink:#17363d;--teal:#0f4c5c;--teal2:#1f6f7a;--orange:#e07a3f;--muted:#5f6f71;--line:#dce8e5;--paper:#fffdf8;--bad:#b23a2b;--good:#2f7d5b;--bg:#eef4f2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.55}
  button,input{font:inherit}
  .hidden{display:none!important}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#dff0ea,transparent 40%),radial-gradient(circle at 90% 90%,#fbe7d6,transparent 35%),#eef4f2}
  .login-card{width:min(960px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(15,76,92,.12)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:15px;background:var(--teal);display:grid;place-items:center;color:#fff;font-size:22px}
  .brand h1{margin:0;font-size:24px;letter-spacing:.02em}.brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}
  .login-title{margin:22px 0 4px;font-size:18px}.login-sub{margin:0 0 14px;font-size:11px;color:var(--muted)}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .role{border:1px solid #d4e2df;background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}
  .role.on{border-color:var(--teal);background:#eef8f2;box-shadow:0 0 0 2px rgba(15,76,92,.08)}
  .role strong{display:block;font-size:14px}.role span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
  .role .ico{font-size:20px;margin-bottom:4px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
  input{width:100%;padding:9px 10px;border:1px solid #cfdedb;border-radius:10px;background:#fff;color:var(--ink);font-size:13px}
  .login-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .primary{border:0;border-radius:10px;padding:9px 16px;background:var(--teal);color:#fff;cursor:pointer;font-size:13px}
  .ghost{border:1px solid #cfdedb;border-radius:10px;padding:8px 12px;background:#fff;color:var(--teal);cursor:pointer;font-size:12px}
  .login-note{font-size:10px;color:var(--muted);margin-top:10px}
  .error{color:var(--bad);font-size:11px;min-height:16px;margin-top:4px}
  .demo-list{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.8}

  .shell{min-height:100vh;display:flex;flex-direction:column}
  .top{background:var(--teal);color:#fff9ef;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .top .brand h1{font-size:18px}.top .brand p{color:#cfe3df}
  .top .logo{width:34px;height:34px;border-radius:11px;font-size:16px;background:#fff2e6;color:var(--teal)}
  .who{display:flex;align-items:center;gap:8px;font-size:11px}
  .who .pill{background:#fff2e6;color:#7a5438;border-radius:999px;padding:3px 8px;font-size:10px}
  .logout{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:9px;padding:6px 10px;cursor:pointer;font-size:11px}
  .main{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;max-width:1180px;width:100%;margin:0 auto;padding:14px}
  .side{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:9px;height:max-content}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#52676a;cursor:pointer;font-size:12px}
  .nav button.on{background:#e8f3f0;color:var(--teal);font-weight:700}
  .content{min-width:0}
  .hero{background:linear-gradient(135deg,#0f4c5c,#1f6f7a);color:#fff9ef;border-radius:18px;padding:18px 20px}
  .hero h2{margin:0 0 3px;font-size:21px}.hero p{margin:0;font-size:11px;color:#d5e9e4}
  .hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .hero .mini{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 9px;font-size:11px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
  .card h3{margin:0 0 5px;font-size:13px}.card p{margin:3px 0;font-size:11px;color:#52676a}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .stat{background:#f4f9f7;border:1px solid #e0ebe8;border-radius:10px;padding:8px}.stat b{display:block;font-size:19px;color:var(--teal)}.stat span{font-size:9px;color:var(--muted)}
  .alert{border-left:4px solid var(--bad);background:#fff7f5;border-radius:10px;padding:9px 10px;margin:7px 0;font-size:11px}
  .alert.good{border-color:var(--good);background:#f3fbf6}.alert small{color:var(--muted);font-size:9px}
  .pill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:9px;border:1px solid #dce8e5;background:#f4f9f7;color:#52676a}
  .pill.bad{background:#fff3f1;border-color:#f2c8c3;color:#7a1b13}.pill.good{background:#eef8f2;border-color:#cfe5d6;color:#2f5f45}
  .list{display:flex;flex-direction:column;gap:6px}.list .item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #e8f0ee;padding:6px 0;font-size:11px}.list .item:last-child{border:0}
  .mic{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#2a7b86,#0f4c5c);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 12px 28px rgba(15,76,92,.22);margin:8px auto;display:block}
  .mic.small{width:auto;height:auto;border-radius:10px;padding:9px 13px;font-size:12px;margin:0}
  .chat{height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff;margin-top:8px}
  .msg{margin:6px 0;display:flex}.msg .b{max-width:85%;padding:8px 10px;border-radius:12px;font-size:12px;white-space:pre-wrap}.msg.agent .b{background:#eef8f2;color:#17363d;border-top-left-radius:3px}.msg.user{justify-content:flex-end}.msg.user .b{background:var(--teal);color:#fff;border-top-right-radius:3px}
  .chat-input{display:flex;gap:6px;margin-top:7px}.chat-input input{flex:1}
  .call-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .call-row button{border:1px solid #cfdedb;background:#fff;color:var(--teal);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:11px}
  .readonly{background:#f4f9f7;border:1px dashed #cfe0dc;border-radius:10px;padding:8px 10px;font-size:10px;color:#52676a;margin-top:8px}
  .doctor-row{display:grid;grid-template-columns:180px 1fr;gap:10px}.patient{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:#fff;margin-bottom:6px}.patient.on{border-color:var(--teal);background:#eef8f2}
  .modal{position:fixed;inset:0;background:rgba(15,40,45,.45);display:grid;place-items:center;padding:18px;z-index:20}.modal .box{background:#fffdf8;border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;white-space:pre-wrap;font-size:12px}
  .modal .box h3{margin:0 0 8px}.modal .box button{margin-top:10px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17363d;color:#fff;padding:9px 13px;border-radius:9px;font-size:11px;z-index:30;opacity:0;transition:.2s}.toast.show{opacity:1}
  .setting-row{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}.setting-row label{min-width:60px;font-size:11px;color:var(--muted)}.setting-row input[type=range]{flex:1;min-width:120px}.setting-row select{max-width:260px;padding:7px;border:1px solid #cfdedb;border-radius:8px;font-size:12px;background:#fff}.setting-val{font-size:11px;color:var(--teal);min-width:44px;text-align:right}.offline-bar{background:#fff4e8;border-bottom:1px solid #efd8c3;color:#7a5438;padding:6px 14px;font-size:11px;text-align:center}.offline-bar.hidden{display:none}
  .speech-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#0f4c5c;color:#fff;border-radius:12px;padding:8px 11px;font-size:11px;display:flex;gap:8px;align-items:center;z-index:25;box-shadow:0 8px 24px rgba(15,76,92,.25)}.speech-bar.hidden{display:none}.speech-bar button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:7px;padding:3px 7px;font-size:10px;cursor:pointer}
  .muted{color:var(--muted);font-size:10px}
  .context-bar{display:flex;align-items:center;gap:7px;background:#fff8ef;border:1px solid #efd8c3;border-radius:9px;padding:7px 10px;margin-top:8px;font-size:11px;color:#7a4326}
  .context-bar strong{font-size:13px}.context-bar code{background:#fff;border:1px solid #efd8c3;border-radius:4px;padding:1px 4px}
  .context-bar button{margin-left:auto;border:1px solid #efd8c3;background:#fff;color:#7a4326;border-radius:7px;padding:4px 8px;font-size:10px;cursor:pointer}
  .safety-check{display:flex;align-items:flex-start;justify-content:flex-start;gap:6px;font-size:11px;color:#7a1b13;background:#fff3f1;border:1px solid #f2c8c3;border-radius:8px;padding:7px;margin-top:8px;line-height:1.5}
  .safety-check input{width:auto!important;flex:0 0 auto;margin-top:2px}
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .book{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid #cfdedb;background:linear-gradient(160deg,#fffdf8,#f4f9f7);border-radius:10px;padding:10px;text-align:left;cursor:pointer;color:#17363d}
  .book strong{font-size:14px}.book span{font-size:10px;color:#52676a}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  .row2 label{font-size:10px;color:#6b7b7d;display:flex;flex-direction:column;gap:3px}
  .row2 input,.row2 select{border:1px solid #cfdedb;border-radius:7px;padding:7px;font:inherit;font-size:11px;background:#fff}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}
  .chat-card{padding:10px}
  .care-mini{background:#fff8ef;border:1px solid #efd8c3;border-radius:11px;padding:8px 10px;font-size:10px;line-height:1.55;color:#6b4a35}
  .care-mini-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;color:#7a4326;font-size:11px}
  .care-mini-head .link-btn{font-size:9px}
  .care-mini p{margin:0}
  .big-mic{display:flex;flex-direction:column;align-items:center;justify-content:center;width:168px;height:168px;border-radius:50%;border:0;background:#0f4c5c;color:#fff9ef;margin:12px auto 8px;box-shadow:0 10px 30px rgba(15,76,92,.22),0 0 0 12px rgba(255,255,255,.55);cursor:pointer}
  .big-mic-ico{width:34px;height:34px;line-height:1;margin-bottom:5px;color:#fff9ef}
  .big-mic b{font-size:17px;line-height:1.25;font-weight:700}
  .chat-card .chat{height:auto;min-height:56px;max-height:150px;margin-top:4px;overflow:auto}
  .chat-card .chat .b{font-size:12px}
  .quick-chips{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
  .quick-chips button{border:1px solid #cfdedb;background:#fff;color:#52676a;border-radius:99px;padding:7px 10px;font-size:11px;cursor:pointer}
  .chat-card .chat-input input{font-size:12px;padding:9px}
  .send-arrow{width:42px;min-width:42px;border-radius:50%;font-size:16px;padding:8px}
  .chat-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
  .chat-actions button{border:1px solid #cfdedb;background:#fff;color:#0f4c5c;border-radius:9px;padding:8px 4px;font-size:11px;cursor:pointer}
  #micStatus:empty{display:none}
  .elder-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .elder-tabs button{border:1px solid #cfdedb;background:#fff;color:var(--teal);border-radius:10px;padding:8px 11px;font-size:12px;cursor:pointer}
  .elder-tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  body.elder-role .side{display:none}
  body.elder-role .main{grid-template-columns:1fr}
  body.elder-role .content{grid-column:1;font-size:15px}
  body.elder-role .card p,body.elder-role .list .item,body.elder-role .chat .b{font-size:13px!important;line-height:1.7}
  body.elder-role .hero h2{font-size:25px}
  body.elder-role .stat b{font-size:24px}
  body.elder-role .stat span{font-size:11px}
  body.elder-role .card h3{font-size:15px}
  body.elder-role .mic.small{font-size:15px;padding:12px 16px}
  @media(max-width:760px){body.elder-role .main{grid-template-columns:1fr}}
  @media(max-width:760px){.roles{grid-template-columns:1fr}.form{grid-template-columns:1fr}.main{grid-template-columns:1fr;padding:9px}.side{order:2}.nav{flex-direction:row;overflow:auto}.doctor-row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.login-card{padding:18px}.hero h2{font-size:18px}}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="logo">乡</div><div><h1>乡音健康管家</h1><p>粤语优先 · 居家健康智能体 · 三端 App</p></div></div>
    <h2 class="login-title">登录</h2>

    <div class="roles" id="roles"></div>
    <div class="form">
      <div><label>账号</label><input id="account" autocomplete="username"></div>
      <div><label>密码 / 验证码</label><input id="password" type="password" autocomplete="current-password" value="123456"></div>
    </div>
    <div class="error" id="error"></div>
    <div class="login-actions"><button class="primary" id="loginBtn">登录</button></div>

  </div>
</div>

<div id="offlineBar" class="offline-bar hidden">而家断网：仍可看今日信息；急症请直接叫家人/120。</div>
<div id="maintenanceBar" class="maintenance-bar hidden">系统维护中：暂时答唔到，可以按「叫家人／叫医生」。</div>
<div id="speechBar" class="speech-bar hidden"><span id="speechStatus">播报中</span><button id="speechPause">暂停</button><button id="speechStop">停止</button></div>
<div id="shell" class="shell hidden">
  <div class="top">
    <div class="brand"><div class="logo">乡</div><div><h1>乡音健康管家</h1><p id="topSub">三端 App</p></div></div>
    <div class="who"><span class="pill" id="rolePill"></span><span id="whoName"></span><button class="logout" id="logout">退出</button></div>
  </div>
  <div class="main">
    <aside class="side"><div class="nav" id="nav"></div></aside>
    <section class="content" id="content"></section>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="box"><h3 id="modalTitle"></h3><div id="modalBody"></div><button class="ghost" id="modalClose">关闭</button></div></div>
<div id="toast" class="toast"></div>

<script src="config.js?v=22"></script>
<script>
(function(){
  var CFG = window.CAREKEEPER_CONFIG || window.CONFIG || {};
  var API = String(CFG.apiBase || "").replace(/\/+$/, "");
  var qp = new URLSearchParams(location.search); if(qp.get("api")) API = qp.get("api").replace(/\/+$/, "");
  async function apiFetch(path, opts, retry) {
    opts = opts || {};
    var controller = new AbortController();
    var timer = setTimeout(function(){controller.abort()}, 20000);
    try {
      var r = await fetch(API + path, Object.assign({}, opts, {signal: controller.signal, headers: Object.assign({Authorization: token ? "Bearer " + token : ""}, opts.headers || {})}));
      if (r.status === 401 && retry !== false) {
        token = ""; sessionStorage.removeItem("ck_token"); sessionStorage.removeItem("ck_role");
        throw new Error("session expired");
      }
      return r;
    } finally { clearTimeout(timer); }
  }
  var ACCOUNTS = {
    elder: {name:"陈婆婆", label:"老人端", account:"13800000001", password:"123456"},
    family: {name:"陈先生", label:"家人端", account:"13800000002", password:"123456"},
    doctor: {name:"李医生", label:"医生端", account:"13800000003", password:"123456"}
  };
  var role = sessionStorage.getItem("ck_role") || qp.get("role") || "";
  var token = sessionStorage.getItem("ck_token") || "";
  var userName = sessionStorage.getItem("ck_name") || "";
  var userSite = null;
  var tab = "";
  var selectedPatient = "";
  var patients = {};
  var doctorPatients = [];
  var appObs = null;
  var doctorDetail = null;
  var navs = {
    elder: [["home","今日"],["chat","同我讲"],["meds","用药"],["family","家人/医生"]],
    family: [["overview","今日报告"],["alerts","红线告警"],["meds","用药/复诊"],["doctor","医生摘要"],["consent","授权"]],
    doctor: [["patients","我的老人"],["profile","档案"],["observations","今日信息"],["trends","趋势"],["alerts","告警"]]
  };
  var state = {messages:[{role:"agent", text:"婆婆，你好，我系智能助手，唔系真人。你可以按下面讲，或者打字。"}]};
  var agentState = {};
  var featureFlags = {};
  var elderLarge = localStorage.getItem("ck_elder_large") === "1";
  var autoSpeak = localStorage.getItem("ck_auto_speak") !== "0";
  var ttsWarned = false;
  var prefs = {};
  try { prefs = JSON.parse(localStorage.getItem("ck_speech_prefs") || "{}") || {}; } catch(e) { prefs = {}; }
  var speechRate = Number(prefs.rate || 0.82);
  var speechVolume = Number(prefs.volume || 1);
  var speechVoiceURI = prefs.voice || "";
  function savePrefs(){ try { localStorage.setItem("ck_speech_prefs", JSON.stringify({rate:speechRate, volume:speechVolume, voice:speechVoiceURI})); } catch(e){} }
  function availableVoices(){
    if(!("speechSynthesis" in window)) return [];
    return speechSynthesis.getVoices().filter(function(v){ return /^zh/i.test(v.lang) || /yue|粤|Cantonese/i.test(v.name); });
  }
  var speechState = {chunks:[], index:0, playing:false, paused:false};
  function splitSpeech(text){
    var clean = String(text||"").replace(/\s+/g," ").trim();
    if(!clean) return [];
    var parts = clean.split(/(?<=[。！？；!?;\n])/).map(function(x){return x.trim()}).filter(Boolean);
    var out=[];
    parts.forEach(function(p){
      if(p.length<=90){out.push(p);return}
      for(var i=0;i<p.length;i+=90) out.push(p.slice(i,i+90));
    });
    return out;
  }
  function updateSpeechBar(){
    var bar=$("#speechBar");if(!bar)return;
    var on=speechState.playing||speechState.paused;
    bar.classList.toggle("hidden",!on);
    if(on)$("#speechStatus").textContent=(speechState.paused?"已暂停":"播报")+" "+(speechState.index+1)+"/"+speechState.chunks.length;
    var b=$("#speechPause");if(b)b.textContent=speechState.paused?"继续":"暂停";
  }
  function speakNext(){
    if(speechState.index>=speechState.chunks.length){speechState.playing=false;speechState.paused=false;speechState.index=0;updateSpeechBar();return}
    var u=new SpeechSynthesisUtterance(speechState.chunks[speechState.index]);
    u.lang=(userSite&&userSite.voice==="zh-HK")?"zh-HK":((userSite&&userSite.dialect==="粤语")?"zh-HK":"zh-CN");u.rate=speechRate;u.volume=speechVolume;
    var vs=availableVoices();
    if(speechVoiceURI){var pick=vs.filter(function(v){return v.voiceURI===speechVoiceURI})[0];if(pick)u.voice=pick}
    else{var hk=vs.filter(function(v){return /zh-HK|yue|粤|Cantonese/i.test(v.lang+" "+v.name)})[0];if(hk)u.voice=hk;else if(vs[0]){u.voice=vs[0];if(!ttsWarned){ttsWarned=true;toast("未装粤语音色，先用可用中文声音")}}}
    u.onend=function(){if(!speechState.playing)return;speechState.index++;updateSpeechBar();speakNext()};
    u.onerror=function(){speechState.playing=false;updateSpeechBar()};
    speechSynthesis.speak(u);
  }
  function speakText(text){
    if(!("speechSynthesis" in window)){ toast("呢部机未支持播报"); return; }
    var chunks=splitSpeech(text);if(!chunks.length)return;
    speechSynthesis.cancel();
    speechState={chunks:chunks,index:0,playing:true,paused:false};
    updateSpeechBar();speakNext();
  }
  function stopSpeech(){if("speechSynthesis" in window)speechSynthesis.cancel();speechState.playing=false;speechState.paused=false;speechState.index=0;updateSpeechBar()}
  function togglePause(){
    if(!("speechSynthesis" in window))return;
    if(!speechState.playing&&!speechState.paused)return;
    if(speechState.paused){speechSynthesis.resume();speechState.paused=false}
    else{speechSynthesis.pause();speechState.paused=true}
    updateSpeechBar();

  function trendSvg(rows){
    if(!rows.length)return '<p class="muted">暂无趋势数据。</p>';
    var data=rows.slice(0,7).reverse(),w=640,h=190,pad=30,max=0,min=999;
    data.forEach(function(x){[x.systolic,x.diastolic,x.heart_rate].forEach(function(v){if(v!=null){max=Math.max(max,v);min=Math.min(min,v)}})});
    max=Math.max(max+10,120);min=Math.max(30,min-10);
    function y(v){return h-pad-(v-min)/(max-min)*(h-pad*2)}
    function line(key,color){var pts=data.map(function(x,i){var px=pad+i*(w-pad*2)/Math.max(1,data.length-1);return px.toFixed(1)+","+y(x[key]).toFixed(1)}).join(" ");return '<polyline fill="none" stroke="'+color+'" stroke-width="2.5" points="'+pts+'"/>'}
    var labels=data.map(function(x,i){var px=pad+i*(w-pad*2)/Math.max(1,data.length-1);return '<text x="'+px+'" y="'+(h-8)+'" font-size="9" fill="#5f6f71" text-anchor="middle">'+esc(x.observed_date.slice(5))+'</text>'}).join("");
    var dots=data.map(function(x,i){var px=pad+i*(w-pad*2)/Math.max(1,data.length-1);return '<circle cx="'+px+'" cy="'+y(x.systolic)+'" r="3" fill="#b23a2b"/>'}).join("");
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;background:#fff;border:1px solid #e8f0ee;border-radius:10px">'+
      '<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(h-pad)+'" stroke="#cfdedb"/>'+
      '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#cfdedb"/>'+
      line("systolic","#b23a2b")+line("diastolic","#0f4c5c")+line("heart_rate","#d99a2b")+dots+labels+
      '<text x="'+pad+'" y="16" font-size="10" fill="#b23a2b">上压</text><text x="'+(pad+44)+'" y="16" font-size="10" fill="#0f4c5c">下压</text><text x="'+(pad+88)+'" y="16" font-size="10" fill="#d99a2b">心率</text></svg>';
  }

      try{var r=await apiFetch("/api/doctor/observations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patient_id:selectedPatient,observed_date:$("#obsDate").value,heart_rate:Number($("#obsHr").value),systolic:Number($("#obsSys").value),diastolic:Number($("#obsDia").value),respiratory_rate:Number($("#obsRr").value),sputum:$("#obsSputum").value,urine:$("#obsUrine").value,note:$("#obsNote").value})});if(!r.ok)throw new Error("HTTP "+r.status);await loadDoctorDetail();toast("今日信息已同步");renderShell()}catch(e){toast("保存失败："+e.message)}
    };
    if($("#exportTrend"))$("#exportTrend").onclick=function(){var rows=(doctorDetail&&doctorDetail.observations)||[];var csv="日期,心率,上压,下压,呼吸,咳痰,排尿\n"+rows.map(function(x){return [x.observed_date,x.heart_rate,x.systolic,x.diastolic,x.respiratory_rate,x.sputum,x.urine].join(",")}).join("\n");var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="trend-"+selectedPatient+".csv";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};
    if($("#planDrug"))$("#planDrug").onchange=function(){var d={氨氯地平:"5mg",缬沙坦:"80mg",美托洛尔:"25mg",二甲双胍:"0.5g",阿卡波糖:"50mg"};$("#planDose").value=d[this.value]||""};
    if($("#savePlan"))$("#savePlan").onclick=async function(){
      if(!$("#confirmMed").checked){toast("请先核对：这是当前老人的药");return}
      if(!p)return;
      openModal("核对用药老人","<p>你即将给 <strong>"+esc(p.name)+"</strong>（ID: "+esc(p.id)+"）保存用药方案。</p><p>请确认不是另一位老人。</p><div class='call-row'><button class='primary' id='confirmMedYes'>确认保存</button></div>");
      $("#confirmMedYes").onclick=async function(){
        try{var r=await apiFetch("/api/doctor/med-plans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({patient_id:selectedPatient,confirm_patient_id:selectedPatient,drug:$("#planDrug").value,dose:$("#planDose").value,frequency:$("#planFreq").value,duration:$("#planDuration").value,note:$("#planNote").value})});if(!r.ok)throw new Error("HTTP "+r.status);$("#modal").classList.add("hidden");await loadDoctorDetail();toast("用药方案已保存");renderShell()}catch(e){toast("保存失败："+e.message)}
      };
    };
  }

  $("#roles").addEventListener("click",function(){});
  $("#loginBtn").onclick=login;
  $("#password").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
  $("#logout").onclick=logout;
  function openModal(title, body){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=body;$("#modal").classList.remove("hidden")}
  $("#modalClose").onclick=function(){$("#modal").classList.add("hidden")};
  $("#speechPause").onclick=togglePause;$("#speechStop").onclick=stopSpeech;
  function updateMaintenance(){
    var b=$("#maintenanceBar");if(!b)return;
    var on=!!featureFlags.maintenance || featureFlags.agent_enabled===false;
    b.classList.toggle("hidden",!on);
  }
  async function loadFlags(){
    try{var r=await fetch(API+"/api/features");if(!r.ok)return;var d=await r.json();featureFlags=d.features||{};updateMaintenance();}catch(e){}
  }
  function applyElderLarge(){document.body.classList.toggle("elder-large",elderLarge);var b=$("#elderToggle");if(b)b.textContent="长辈模式："+(elderLarge?"开":"关")}
  function updateOffline(){var b=$("#offlineBar");if(b)b.classList.toggle("hidden",navigator.onLine)}
  window.addEventListener("online",function(){updateOffline();toast("网络返嚟啦")});
  window.addEventListener("offline",function(){updateOffline();toast("已断网，仍可看今日信息")});
  updateOffline();
  if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();if(tab==="settings")bindSettings()};}
  applyElderLarge();
  boot();
  loadFlags();setInterval(loadFlags,30000);
})();
</script>
</body>
</html>
