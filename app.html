<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乡音健康管家 · 三端 App</title>
<style>
  :root{--ink:#17363d;--teal:#0f4c5c;--teal2:#1f6f7a;--orange:#e07a3f;--muted:#6b7b7d;--line:#dce8e5;--paper:#fffdf8;--bad:#b23a2b;--good:#2f7d5b;--bg:#eef4f2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.55}
  button,input{font:inherit}
  .hidden{display:none!important}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#dff0ea,transparent 40%),radial-gradient(circle at 90% 90%,#fbe7d6,transparent 35%),#eef4f2}
  .login-card{width:min(960px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(15,76,92,.12)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:15px;background:var(--teal);display:grid;place-items:center;color:#fff;font-size:22px}
  .brand h1{margin:0;font-size:24px;letter-spacing:.02em}.brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}
  .login-title{margin:22px 0 4px;font-size:18px}.login-sub{margin:0 0 14px;font-size:11px;color:var(--muted)}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .role{border:1px solid #d4e2df;background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}
  .role.on{border-color:var(--teal);background:#eef8f2;box-shadow:0 0 0 2px rgba(15,76,92,.08)}
  .role strong{display:block;font-size:14px}.role span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
  .role .ico{font-size:20px;margin-bottom:4px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
  input{width:100%;padding:9px 10px;border:1px solid #cfdedb;border-radius:10px;background:#fff;color:var(--ink);font-size:13px}
  .login-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .primary{border:0;border-radius:10px;padding:9px 16px;background:var(--teal);color:#fff;cursor:pointer;font-size:13px}
  .ghost{border:1px solid #cfdedb;border-radius:10px;padding:8px 12px;background:#fff;color:var(--teal);cursor:pointer;font-size:12px}
  .login-note{font-size:10px;color:var(--muted);margin-top:10px}
  .error{color:var(--bad);font-size:11px;min-height:16px;margin-top:4px}
  .demo-list{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.8}

  .shell{min-height:100vh;display:flex;flex-direction:column}
  .top{background:var(--teal);color:#fff9ef;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .top .brand h1{font-size:18px}.top .brand p{color:#cfe3df}
  .top .logo{width:34px;height:34px;border-radius:11px;font-size:16px;background:#fff2e6;color:var(--teal)}
  .who{display:flex;align-items:center;gap:8px;font-size:11px}
  .who .pill{background:#fff2e6;color:#7a5438;border-radius:999px;padding:3px 8px;font-size:10px}
  .logout{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:9px;padding:6px 10px;cursor:pointer;font-size:11px}
  .main{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;max-width:1180px;width:100%;margin:0 auto;padding:14px}
  .side{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:9px;height:max-content}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#52676a;cursor:pointer;font-size:12px}
  .nav button.on{background:#e8f3f0;color:var(--teal);font-weight:700}
  .content{min-width:0}
  .hero{background:linear-gradient(135deg,#0f4c5c,#1f6f7a);color:#fff9ef;border-radius:18px;padding:18px 20px}
  .hero h2{margin:0 0 3px;font-size:21px}.hero p{margin:0;font-size:11px;color:#d5e9e4}
  .hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .hero .mini{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 9px;font-size:11px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
  .card h3{margin:0 0 5px;font-size:13px}.card p{margin:3px 0;font-size:11px;color:#52676a}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .stat{background:#f4f9f7;border:1px solid #e0ebe8;border-radius:10px;padding:8px}.stat b{display:block;font-size:19px;color:var(--teal)}.stat span{font-size:9px;color:var(--muted)}
  .alert{border-left:4px solid var(--bad);background:#fff7f5;border-radius:10px;padding:9px 10px;margin:7px 0;font-size:11px}
  .alert.good{border-color:var(--good);background:#f3fbf6}.alert small{color:var(--muted);font-size:9px}
  .pill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:9px;border:1px solid #dce8e5;background:#f4f9f7;color:#52676a}
  .pill.bad{background:#fff3f1;border-color:#f2c8c3;color:#7a1b13}.pill.good{background:#eef8f2;border-color:#cfe5d6;color:#2f5f45}
  .list{display:flex;flex-direction:column;gap:6px}.list .item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #e8f0ee;padding:6px 0;font-size:11px}.list .item:last-child{border:0}
  .mic{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#2a7b86,#0f4c5c);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 12px 28px rgba(15,76,92,.22);margin:8px auto;display:block}
  .mic.small{width:auto;height:auto;border-radius:10px;padding:9px 13px;font-size:12px;margin:0}
  .chat{height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff;margin-top:8px}
  .msg{margin:6px 0;display:flex}.msg .b{max-width:85%;padding:8px 10px;border-radius:12px;font-size:12px;white-space:pre-wrap}.msg.agent .b{background:#eef8f2;color:#17363d;border-top-left-radius:3px}.msg.user{justify-content:flex-end}.msg.user .b{background:var(--teal);color:#fff;border-top-right-radius:3px}
  .chat-input{display:flex;gap:6px;margin-top:7px}.chat-input input{flex:1}
  .call-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .call-row button{border:1px solid #cfdedb;background:#fff;color:var(--teal);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:11px}
  .readonly{background:#f4f9f7;border:1px dashed #cfe0dc;border-radius:10px;padding:8px 10px;font-size:10px;color:#52676a;margin-top:8px}
  .doctor-row{display:grid;grid-template-columns:180px 1fr;gap:10px}.patient{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:#fff;margin-bottom:6px}.patient.on{border-color:var(--teal);background:#eef8f2}
  .modal{position:fixed;inset:0;background:rgba(15,40,45,.45);display:grid;place-items:center;padding:18px;z-index:20}.modal .box{background:#fffdf8;border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;white-space:pre-wrap;font-size:12px}
  .modal .box h3{margin:0 0 8px}.modal .box button{margin-top:10px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17363d;color:#fff;padding:9px 13px;border-radius:9px;font-size:11px;z-index:30;opacity:0;transition:.2s}.toast.show{opacity:1}
  .muted{color:var(--muted);font-size:10px}
  @media(max-width:760px){.roles{grid-template-columns:1fr}.form{grid-template-columns:1fr}.main{grid-template-columns:1fr;padding:9px}.side{order:2}.nav{flex-direction:row;overflow:auto}.doctor-row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.login-card{padding:18px}.hero h2{font-size:18px}}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="logo">乡</div><div><h1>乡音健康管家</h1><p>粤语优先 · 居家健康智能体 · 三端 App</p></div></div>
    <h2 class="login-title">登录</h2>
    <p class="login-sub">演示账号：选择角色后自动填入；生产环境使用手机号 OTP / 微信 OAuth / 医生 MFA。</p>
    <div class="roles" id="roles"></div>
    <div class="form">
      <div><label>账号</label><input id="account" autocomplete="username"></div>
      <div><label>密码 / 验证码</label><input id="password" type="password" autocomplete="current-password" value="123456"></div>
    </div>
    <div class="error" id="error"></div>
    <div class="login-actions"><button class="primary" id="loginBtn">登录</button><span class="muted">演示环境，非真实认证</span></div>
    <div class="demo-list">老人：13800000001 · 家人：13800000002 · 医生：13800000003 · 密码均为 123456</div>
  </div>
</div>

<div id="shell" class="shell hidden">
  <div class="top">
    <div class="brand"><div class="logo">乡</div><div><h1>乡音健康管家</h1><p id="topSub">三端 App</p></div></div>
    <div class="who"><span class="pill" id="rolePill"></span><span id="whoName"></span><button class="logout" id="logout">退出</button></div>
  </div>
  <div class="main">
    <aside class="side"><div class="nav" id="nav"></div></aside>
    <section class="content" id="content"></section>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="box"><h3 id="modalTitle"></h3><div id="modalBody"></div><button class="ghost" id="modalClose">关闭</button></div></div>
<div id="toast" class="toast"></div>

<script src="config.js?v=22"></script>
<script>
(function(){
  var API = String((window.CONFIG && CONFIG.apiBase) || "").replace(/\/+$/, "");
  var qp = new URLSearchParams(location.search); if(qp.get("api")) API = qp.get("api").replace(/\/+$/, "");
  var ACCOUNTS = {
    elder: {name:"陈婆婆", label:"老人端", account:"13800000001", password:"123456"},
    family: {name:"陈先生", label:"家人端", account:"13800000002", password:"123456"},
    doctor: {name:"李医生", label:"医生端", account:"13800000003", password:"123456"}
  };
  var role = sessionStorage.getItem("ck_role") || "";
  var token = sessionStorage.getItem("ck_token") || "";
  var userName = sessionStorage.getItem("ck_name") || "";
  var tab = "";
  var selectedPatient = "";
  var patients = {};
  var navs = {
    elder: [["home","今日"],["chat","同我讲"],["meds","用药"],["family","家人/医生"]],
    family: [["overview","今日报告"],["alerts","红线告警"],["meds","用药/复诊"],["doctor","医生摘要"],["consent","授权"]],
    doctor: [["patients","我的老人"],["summary","只读摘要"],["alerts","告警"]]
  };
  var state = {messages:[{role:"agent", text:"婆婆，你好，我系智能助手，唔系真人。你可以按下面讲，或者打字。"}]};

  function $(s){return document.querySelector(s)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
  function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},2200)}
  function roleName(r){return ACCOUNTS[r].label}

  function renderLogin(){
    $("#login").classList.remove("hidden");$("#shell").classList.add("hidden");
    var box=$("#roles");box.innerHTML="";
    ["elder","family","doctor"].forEach(function(r){
      var a=ACCOUNTS[r];var b=document.createElement("button");b.type="button";b.className="role"+(r===role?" on":"");
      b.innerHTML='<div class="ico">'+(r==="elder"?"👵":r==="family"?"👨‍👩‍👧":"🩺")+'</div><strong>'+a.label+'</strong><span>'+a.name+' · '+a.account+'</span>';
      b.onclick=function(){role=r;$("#account").value=a.account;$("#password").value=a.password;renderLogin();};
      box.appendChild(b);
    });
  }
  async function loadPatients(){
    var r=await fetch(API+"/api/app/patients",{headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw new Error("patients "+r.status);
    var d=await r.json();patients={};d.patients.forEach(function(p){patients[p.id]=p});
    var keys=Object.keys(patients);selectedPatient=keys[0]||"";
  }
  async function login(){
    if(!role){$("#error").textContent="请先选择角色";return}
    $("#error").textContent="登录中…";
    try{
      var r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account:$("#account").value.trim(),password:$("#password").value})});
      var d=await r.json();
      if(!r.ok) throw new Error(d.error||"登录失败");
      token=d.token;role=d.role;userName=d.name;
      sessionStorage.setItem("ck_token",token);sessionStorage.setItem("ck_role",role);sessionStorage.setItem("ck_name",userName);
      await loadPatients();tab=navs[role][0][0];$("#error").textContent="";renderShell();
    }catch(e){$("#error").textContent="登录失败："+e.message}
  }
  function logout(){
    if(token) fetch(API+"/api/auth/logout",{method:"POST",headers:{Authorization:"Bearer "+token}}).catch(function(){});
    token="";role="";userName="";patients={};selectedPatient="";
    sessionStorage.removeItem("ck_token");sessionStorage.removeItem("ck_role");sessionStorage.removeItem("ck_name");renderLogin();
  }
  async function boot(){
    if(!token){renderLogin();return}
    try{
      var r=await fetch(API+"/api/auth/me",{headers:{Authorization:"Bearer "+token}});
      if(!r.ok) throw new Error("session");
      var d=await r.json();role=d.role;userName=d.name;sessionStorage.setItem("ck_role",role);sessionStorage.setItem("ck_name",userName);
      await loadPatients();tab=navs[role][0][0];renderShell();
    }catch(e){token="";role="";sessionStorage.removeItem("ck_token");renderLogin()}
  }

  function renderShell(){
    $("#login").classList.add("hidden");$("#shell").classList.remove("hidden");
    $("#rolePill").textContent=roleName(role);$("#whoName").textContent=userName||ACCOUNTS[role].name;
    $("#topSub").textContent=roleName(role)+" · "+(userName||"演示");
    var nav=$("#nav");nav.innerHTML="";
    navs[role].forEach(function(x){var b=document.createElement("button");b.textContent=x[1];b.className=x[0]===tab?"on":"";b.onclick=function(){tab=x[0];renderShell()};nav.appendChild(b)});
    if(role==="elder") renderElder(); else if(role==="family") renderFamily(); else renderDoctor();
  }

  function alertHTML(a){
    return '<div class="alert '+(a.level==="high"?"":"good")+'"><strong>'+(a.handled?"已处理":"待处理")+'</strong> · '+esc(a.t)+'<br>'+esc(a.text)+'</div>';
  }
  function renderElder(){
    var p=patients[Object.keys(patients)[0]];
    var html='<div class="hero"><h2>'+esc(p.name)+'，早晨</h2><p>今日：量血压 · 早上药 · 下周三复诊</p><div class="row"><span class="mini">血压 '+p.bp+'</span><span class="mini">用药 '+p.med+'</span><span class="mini">下周三复诊</span></div></div>';
    if(tab==="home"){
      html+='<div class="grid"><div class="card"><h3>今日照护</h3><div class="stat-row"><div class="stat"><b>'+p.bp+'</b><span>最近血压</span></div><div class="stat"><b>'+p.med+'</b><span>用药完成</span></div><div class="stat"><b>1</b><span>待复诊</span></div></div><p class="muted">只做健康教育/提醒，不诊断、不开药。</p></div><div class="card"><h3>我想讲</h3><button class="mic small" id="toChat">按一下讲嘢 / 打字</button><p class="muted" style="margin-top:8px">唔识字都可以用；答唔到会帮你叫家人/医生。</p></div></div>';
      html+='<div class="card" style="margin-top:10px"><h3>今日提醒</h3><div class="list"><div class="item"><span>早上药</span><span class="pill good">已完成</span></div><div class="item"><span>量血压</span><span class="pill">待复测</span></div><div class="item"><span>下周三复诊</span><span class="pill">已提醒</span></div></div></div>';
    } else if(tab==="chat"){
      html+='<div class="card"><h3>同我讲</h3><p class="muted">可以打字；语音按钮先做 UI 占位，真机接 ASR。</p><div class="chat" id="chat"></div><div class="chat-input"><input id="chatInput" placeholder="例如：我今日血压高"><button class="primary" id="chatSend">发送</button></div><div class="call-row"><button data-call="family">叫家人</button><button data-call="doctor">叫医生</button><button id="speakLast">播报最后一条</button></div></div>';
    } else if(tab==="meds"){
      html+='<div class="card"><h3>用药（只读）</h3><div class="list"><div class="item"><span>氨氯地平 5mg · 早上</span><span class="pill">按医嘱</span></div><div class="item"><span>二甲双胍 0.5g · 早晚</span><span class="pill">按医嘱</span></div></div><p class="muted">不调剂量、不换药；有疑问问医生/药师。</p></div>';
    } else {
      html+='<div class="card"><h3>家人 / 医生</h3><p>家人：陈先生（已授权）</p><p>医生：社区医院李医生（只读）</p><div class="call-row"><button data-call="family">叫家人</button><button data-call="doctor">叫医生</button></div><p class="muted">演示：不真实外呼。</p></div>';
    }
    $("#content").innerHTML=html;
    if(tab==="home"){var b=$("#toChat");if(b)b.onclick=function(){tab="chat";renderShell()}}
    if(tab==="chat"){bindChat();}
    document.querySelectorAll("[data-call]").forEach(function(b){b.onclick=function(){toast("已模拟通知"+ (b.dataset.call==="family"?"家人":"医生"))}});
  }

  function bindChat(){
    var chat=$("#chat");
    function draw(){chat.innerHTML=state.messages.map(function(m){return '<div class="msg '+m.role+'"><div class="b">'+esc(m.text)+'</div></div>'}).join("");chat.scrollTop=chat.scrollHeight}
    draw();
    async function send(){
      var input=$("#chatInput");var text=input.value.trim();if(!text)return;input.value="";
      state.messages.push({role:"user",text:text});draw();
      try{
        var r=await fetch(API+"/api/app/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,"X-Request-ID":"APP-"+Date.now()},body:JSON.stringify({patient_id:Object.keys(patients)[0],message:text,history:state.messages.slice(-6)})});
        var d=await r.json();state.messages.push({role:"agent",text:d.reply||"我而家未系好听得明。"});
      }catch(e){state.messages.push({role:"agent",text:"网络未通；可以叫家人/医生。"})}
      draw();
    }
    $("#chatSend").onclick=send;$("#chatInput").addEventListener("keydown",function(e){if(e.key==="Enter")send()});
    $("#speakLast").onclick=function(){var last=state.messages.filter(function(m){return m.role==="agent"}).pop();if(last&&"speechSynthesis" in window){var u=new SpeechSynthesisUtterance(last.text);u.lang="zh-HK";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}else toast("无播报")};
  }

  function renderFamily(){
    var p=patients[Object.keys(patients)[0]];
    var html='<div class="hero"><h2>陈婆婆 · 家人端</h2><p>已授权 · 只读摘要 · 陈先生</p><div class="row"><span class="mini">授权：有效</span><span class="mini">数据：今日</span><span class="mini">来源：KB v0.2</span></div></div>';
    if(tab==="overview"){
      html+='<div class="grid"><div class="card"><h3>今日摘要</h3><p>血压 '+p.bp+'；用药 '+p.med+'；下周三复诊。</p><p class="muted">不是诊断，不替代医生。</p></div><div class="card"><h3>红线</h3>'+(p.alerts.length?p.alerts.map(alertHTML).join(""):'<p>今日未出现红线。</p>')+'</div></div>';
    } else if(tab==="alerts"){
      html+='<div class="card"><h3>红线告警</h3>'+(p.alerts.map(alertHTML).join("")||"<p>今日未出现红线。</p>")+'<p class="muted">家属端站内提醒；不是微信/短信推送。</p></div>';
    } else if(tab==="meds"){
      html+='<div class="card"><h3>用药 / 复诊（只读）</h3><div class="list"><div class="item"><span>氨氯地平 5mg · 早上</span><span class="pill">按医嘱</span></div><div class="item"><span>二甲双胍 0.5g · 早晚</span><span class="pill">按医嘱</span></div><div class="item"><span>复诊：'+p.follow+'</span><span class="pill">已提醒</span></div></div></div>';
    } else if(tab==="doctor"){
      html+='<div class="card"><h3>医生只读摘要</h3><p><strong>'+p.name+'</strong> '+p.age+' 岁 · '+p.area+'</p><p>诊断：'+p.dx+'</p><p>今日：血压 '+p.bp+'；用药 '+p.med+'。</p><p>红线：'+(p.alerts.map(function(a){return a.text}).join("；")||"无")+'</p><p class="muted">只读；不可开药、不可写回病历。</p></div>';
    } else {
      html+='<div class="card"><h3>授权</h3><p>授权对象：陈先生（儿子）</p><p>范围：报告/告警/用药/复诊/回执/医生摘要</p><p class="muted">撤回/删除凭证在旧版家人端 Demo；这里展示产品壳。</p><div class="call-row"><button id="revoke">撤回授权（演示）</button><button id="delete">删除今日数据（演示）</button></div></div>';
    }
    $("#content").innerHTML=html;
    if(tab==="consent"){
      $("#revoke").onclick=function(){confirm("撤回后家属看不到报告，确定？")&&toast("已模拟撤回授权")};
      $("#delete").onclick=function(){confirm("删除今日数据？不可恢复。")&&toast("已模拟删除，保留凭证")};
    }
  }

  function renderDoctor(){
    var p=patients[selectedPatient]||patients[Object.keys(patients)[0]];
    var high=Object.keys(patients).filter(function(k){return patients[k].alerts.some(function(a){return a.level==="high"&&!a.handled})}).length;
    var html='<div class="hero"><h2>医生端 · '+esc(userName)+'</h2><p>只读 · 不可开药 · 不可写回 HIS/EMR</p><div class="row"><span class="mini">我的老人：'+Object.keys(patients).length+'</span><span class="mini">高危：'+high+'</span><span class="mini">只看摘要</span></div></div>';
    html+='<div class="doctor-row" style="margin-top:10px"><div class="card"><h3>我的老人</h3>'+Object.keys(patients).map(function(k){var x=patients[k];return '<div class="patient '+(k===selectedPatient?"on":"")+'" data-p="'+k+'"><strong>'+esc(x.name)+'</strong><br><span class="muted">'+x.age+'岁 · '+esc(x.area)+'</span></div>'}).join("")+'<p class="muted">演示数据；真实需 HIS/家医分配。</p></div><div class="card"><h3>'+esc(p.name)+' · 只读摘要</h3><p>诊断：'+esc(p.dx)+'</p><p>今日血压：'+esc(p.bp)+'；用药：'+esc(p.med)+'。</p><p>复诊：'+esc(p.follow)+'</p><h3 style="margin-top:10px">红线/告警</h3>'+(p.alerts.map(alertHTML).join("")||"<p>今日未出现红线。</p>")+'<div class="readonly">医生端只读；不可开处方/改病历/写回 HIS。告警为站内提醒。</div></div></div>';
    $("#content").innerHTML=html;
    document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){selectedPatient=b.dataset.p;renderShell()}});
  }

  $("#roles").addEventListener("click",function(){});
  $("#loginBtn").onclick=login;
  $("#password").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
  $("#logout").onclick=logout;
  $("#modalClose").onclick=function(){$("#modal").classList.add("hidden")};
  boot();
})();
</script>
</body>
</html>
